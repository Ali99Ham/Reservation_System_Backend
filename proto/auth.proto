syntax = "proto3";

package auth;

service AuthSVC {
    rpc checkAuthenticate (Authentication_Req)
        returns (UserMessage_Res);
}

message Authentication_Req {
  string Authentication=1;
}

message UserMessage_Res {
  string _id=1;
  string name=2;
  string email=3;
//   repeated string roles=4;
}

